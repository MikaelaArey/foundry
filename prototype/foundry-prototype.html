<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Foundry Think Tank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --paper:#F2F4F8; --grid:rgba(20,29,51,.05); --surface:#FFFFFF; --surface-2:#F5F7FB;
  --line:#DCE2EC; --line-strong:#B8C2D4;
  --ink:#141D33; --ink-2:#48536D; --ink-3:#737E97;
  --hl:#FFD43B; --hl-ink:#2A2100; --hl-soft:#FFF4C4; --hl-mark:#FFD43B;
  --btn:#141D33; --btn-ink:#FFFFFF; --btn-hover:#27324F;
  --focus:#2a78d6;
  --note:#FFF6CC; --note-ink:#2B2610; --note-tag:rgba(90,70,0,.1); --note-rule:rgba(90,70,0,.18);
  --spark:#B87100;
  --track:#E6EAF1; --bar-muted:#AAB4C8;
  --good:#0ca30c; --warn:#fab219; --critical:#d03b3b;
  --c-coding:#2a78d6; --c-marketing:#eb6834; --c-product:#1baf7a; --c-finance:#eda100;
  --c-design:#e87ba4; --c-operations:#008300; --c-sales:#4a3aa7; --c-legal:#e34948; --c-custom:#66718C;
  --on-coding:#fff; --on-marketing:#fff; --on-product:#141D33; --on-finance:#141D33;
  --on-design:#141D33; --on-operations:#fff; --on-sales:#fff; --on-legal:#fff; --on-custom:#fff;
  --shadow:0 1px 2px rgba(20,29,51,.05),0 8px 20px -10px rgba(20,29,51,.16);
  --shadow-lg:0 30px 70px -20px rgba(10,16,30,.45);
  --scrim:rgba(10,16,30,.5);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --f-hand:"Caveat","Bradley Hand","Segoe Print","Comic Sans MS",cursive;
  --side-w:256px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0C1528; --grid:rgba(120,150,210,.07); --surface:#121E36; --surface-2:#172643;
    --line:#233459; --line-strong:#344A78;
    --ink:#E6ECF8; --ink-2:#B0BBD3; --ink-3:#8290AE;
    --hl:#FFD43B; --hl-ink:#2A2100; --hl-soft:#35300F; --hl-mark:rgba(255,212,59,.34);
    --btn:#E6ECF8; --btn-ink:#0C1528; --btn-hover:#FFFFFF;
    --focus:#6da7ec;
    --note:#2A2715; --note-ink:#F3EAC5; --note-tag:rgba(255,230,140,.12); --note-rule:rgba(255,230,140,.16);
    --spark:#FFD43B;
    --track:#1E2D4E; --bar-muted:#46577F;
    --c-coding:#3987e5; --c-marketing:#d95926; --c-product:#199e70; --c-finance:#c98500;
    --c-design:#d55181; --c-operations:#008300; --c-sales:#9085e9; --c-legal:#e66767; --c-custom:#8C97B3;
    --on-coding:#fff; --on-marketing:#fff; --on-product:#fff; --on-finance:#0C1528;
    --on-design:#fff; --on-operations:#fff; --on-sales:#0C1528; --on-legal:#0C1528; --on-custom:#0C1528;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 24px -12px rgba(0,0,0,.5);
    --scrim:rgba(3,7,16,.65);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0C1528; --grid:rgba(120,150,210,.07); --surface:#121E36; --surface-2:#172643;
  --line:#233459; --line-strong:#344A78;
  --ink:#E6ECF8; --ink-2:#B0BBD3; --ink-3:#8290AE;
  --hl:#FFD43B; --hl-ink:#2A2100; --hl-soft:#35300F; --hl-mark:rgba(255,212,59,.34);
  --btn:#E6ECF8; --btn-ink:#0C1528; --btn-hover:#FFFFFF;
  --focus:#6da7ec;
  --note:#2A2715; --note-ink:#F3EAC5; --note-tag:rgba(255,230,140,.12); --note-rule:rgba(255,230,140,.16);
  --spark:#FFD43B;
  --track:#1E2D4E; --bar-muted:#46577F;
  --c-coding:#3987e5; --c-marketing:#d95926; --c-product:#199e70; --c-finance:#c98500;
  --c-design:#d55181; --c-operations:#008300; --c-sales:#9085e9; --c-legal:#e66767; --c-custom:#8C97B3;
  --on-coding:#fff; --on-marketing:#fff; --on-product:#fff; --on-finance:#0C1528;
  --on-design:#fff; --on-operations:#fff; --on-sales:#0C1528; --on-legal:#0C1528; --on-custom:#0C1528;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 24px -12px rgba(0,0,0,.5);
  --scrim:rgba(3,7,16,.65);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font:400 14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{text-wrap:balance}
.ic{width:18px;height:18px;flex:none}
.ic.fill{fill:currentColor;stroke:none}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.hlmark{background:linear-gradient(transparent 60%,var(--hl-mark) 60%,var(--hl-mark) 92%,transparent 92%);padding:0 .08em;color:inherit;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;
  height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);
  padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.main{min-width:0;padding-block:32px 88px;padding-inline:clamp(16px,4vw,48px)}
.main:focus{outline:none}
.main-inner{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.topbar{display:none}
.nav-scrim{display:none}

.brand{display:flex;align-items:center;gap:11px;padding:0 6px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--hl);color:var(--hl-ink);display:grid;place-items:center;transform:rotate(-5deg);flex:none}
.logo .ic{width:20px;height:20px}
.wordmark{display:block;font:800 23px/1 var(--f-display);letter-spacing:-.025em}
.brand small{display:block;color:var(--ink-3);font-size:12px;margin-top:4px}
.side-actions{display:grid;gap:8px}
.nav{display:grid;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;font-weight:600;color:var(--ink-2)}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.on{background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.count{margin-left:auto;font:500 12px/1 var(--f-mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.side-label{display:flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:0 10px}
.sp-list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.sp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 8px;padding:8px 10px;border-radius:8px;text-decoration:none}
.sp:hover{background:var(--surface-2)}
.sp.on{background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.sp-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-pct{font:500 12px/1.6 var(--f-mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
.sp .bar{grid-column:1/-1;height:4px}
.side-empty{margin:0;padding:0 10px;color:var(--ink-3);font-size:13px}
.parked summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:4px 10px}
.parked summary::-webkit-details-marker{display:none}
.parked summary::before{content:"▸";font-size:10px;transition:transform .15s}
.parked[open] summary::before{transform:rotate(90deg)}
.parked .sp-list{margin-top:4px}
.side-foot{margin-top:auto;padding:10px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.dot.warn{background:var(--warn)}
.dot.bad{background:var(--critical)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 14px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background-color .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn .ic{width:16px;height:16px}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.primary:hover{background:var(--btn-hover);border-color:var(--btn-hover)}
.btn.hl{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.btn.hl:hover{border-color:var(--hl-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--critical);border-color:var(--critical);color:#fff}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.55;cursor:default}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn .ic{width:16px;height:16px}
.icon-btn[aria-pressed="true"]{color:var(--ink);background:var(--hl-soft)}
.linkish{border:0;background:none;padding:0;color:var(--ink-2);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.linkish:hover{color:var(--ink);text-decoration-color:currentColor}
.linkish .ic{width:15px;height:15px}
input:not([type=checkbox]):not([type=radio]),select,textarea{width:100%;min-height:38px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);color:var(--ink)}
textarea{resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px rgba(42,120,214,.22)}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1;min-width:0}
label.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer}
label.check input{width:16px;height:16px;accent-color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.03em;border:1px solid var(--line-strong);color:var(--ink-2);background:var(--surface);white-space:nowrap}
.chip.ex{border-style:dashed}
.chip.stage{background:var(--hl-soft);border-color:transparent;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.err{margin:0;color:var(--critical);font-size:13px;font-weight:600}
.hint{margin:0;color:var(--ink-3);font-size:12px}

/* ---------- page heads ---------- */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.h-page{margin:0;font:800 clamp(30px,4.4vw,46px)/1.04 var(--f-display);letter-spacing:-.03em}
.lede{margin:10px 0 0;color:var(--ink-2);font-size:15px;max-width:62ch}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.h2{margin:0;font:700 19px/1.2 var(--f-display);letter-spacing:-.01em}
.sec-title{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin-bottom:14px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 10px}
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.panel{padding:16px;display:grid;gap:12px}
.card{padding:18px}

.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--hl-soft);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.banner p{margin:0;max-width:78ch;font-size:13px}
.confirm{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--critical);border-radius:10px;padding:10px 14px;background:var(--surface)}
.confirm p{margin:0;font-size:13px;font-weight:600}

/* ---------- bars ---------- */
.bar{display:block;height:6px;border-radius:6px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--c,var(--ink));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.thick{height:10px}
.seg{display:flex;height:10px;border-radius:6px;background:var(--track);overflow:hidden}
.seg>i{display:block;height:100%;border-right:2px solid var(--surface);flex:none}
.seg-big{height:16px;border-radius:8px}

/* ---------- HQ ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.kpis>div{padding:14px 18px;border-left:1px solid var(--line)}
.kpis>div:first-child{border-left:0}
.kpis dt{font-size:12px;color:var(--ink-3);font-weight:600}
.kpis dd{margin:4px 0 0;font:700 26px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.kpis dd small{font-size:14px;color:var(--ink-3);font-weight:500;margin-left:5px;letter-spacing:0}
.hq-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.hq-side{display:grid;gap:16px}
.p-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.p-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.p-card:hover{border-color:var(--line-strong);transform:translateY(-2px)}
.pc-top{display:flex;gap:6px;flex-wrap:wrap}
.pc-name{margin:0;font:700 19px/1.2 var(--f-display);letter-spacing:-.01em}
.pc-link{text-decoration:none}
.pc-link::after{content:"";position:absolute;inset:0;border-radius:14px}
.pc-link:focus-visible{outline:none}
.pc-link:focus-visible::after{outline:2px solid var(--focus);outline-offset:2px}
.pc-pitch{margin:0;color:var(--ink-2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-overall{display:flex;align-items:baseline;gap:8px}
.pc-pct{font:700 24px/1 var(--f-mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pc-of{font-size:12px;color:var(--ink-3)}
.mini-secs{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.mini-secs li{display:grid;grid-template-columns:minmax(0,92px) 1fr 36px;align-items:center;gap:8px;font-size:12px}
.ms-name{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-pct{font:500 11px var(--f-mono);color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.mini-secs li.ms-more{display:block;color:var(--ink-3)}
.pc-links{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.mini-tool{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2)}
.mini-tool:hover{color:var(--ink);border-color:var(--ink-3)}
.mini-tool .ic{width:16px;height:16px}
.p-card.new{align-items:flex-start;justify-content:center;border:1.5px dashed var(--line-strong);background:transparent;box-shadow:none;cursor:pointer;text-align:left;color:var(--ink-2);min-height:190px;font-size:13px}
.p-card.new b{font:700 17px/1.2 var(--f-display);color:var(--ink)}
.p-card.new:hover{background:var(--surface)}
.hq-parked summary{cursor:pointer;font-weight:600;color:var(--ink-2);margin:18px 0 12px}
.nextup{list-style:none;margin:0 -8px;padding:0;display:grid}
.nu-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);margin-top:2px}
.swatch{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
.swatch.sm{width:8px;height:8px;border-radius:3px}
.mom{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;height:132px}
.mom-y{display:flex;flex-direction:column;justify-content:space-between;font:500 10px/1 var(--f-mono);color:var(--ink-3);padding-bottom:20px;text-align:right}
.mom-plot{display:grid;grid-template-rows:1fr auto;min-width:0}
.mom-bars{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:3px;align-items:end;border-bottom:1px solid var(--line-strong);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 50%}
.mom-col{height:100%;display:flex;align-items:flex-end;outline-offset:1px;border-radius:4px}
.mom-col>i{display:block;width:100%;background:var(--bar-muted);border-radius:4px 4px 0 0}
.mom-col.today>i{background:var(--ink)}
.mom-col:hover>i{background:var(--ink-2)}
.mom-x{display:flex;justify-content:space-between;font:500 10px/1 var(--f-mono);color:var(--ink-3);padding-top:6px}
.sparks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.sparks li{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:8px;background:var(--note);color:var(--note-ink)}
.spark-t{font:700 20px/1.1 var(--f-hand);overflow-wrap:anywhere}
.sparks .muted{color:var(--note-ink);opacity:.65;white-space:nowrap}

/* ---------- goals (shared) ---------- */
.k-coding{--c:var(--c-coding);--on:var(--on-coding)}
.k-marketing{--c:var(--c-marketing);--on:var(--on-marketing)}
.k-product{--c:var(--c-product);--on:var(--on-product)}
.k-finance{--c:var(--c-finance);--on:var(--on-finance)}
.k-design{--c:var(--c-design);--on:var(--on-design)}
.k-operations{--c:var(--c-operations);--on:var(--on-operations)}
.k-sales{--c:var(--c-sales);--on:var(--on-sales)}
.k-legal{--c:var(--c-legal);--on:var(--on-legal)}
.k-custom{--c:var(--c-custom);--on:var(--on-custom)}
.goal{position:relative;display:flex;align-items:flex-start;gap:2px;border-radius:8px}
.goal:hover{background:var(--surface-2)}
.cb{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.goal-label{flex:1;display:flex;gap:10px;align-items:flex-start;padding:7px 8px;cursor:pointer;min-width:0}
.box{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--line-strong);display:grid;place-items:center;background:var(--surface);transition:background-color .15s,border-color .15s}
.box .ic{width:14px;height:14px;stroke-width:3;opacity:0;color:var(--on)}
.goal-label:hover .box{border-color:var(--c)}
.cb:checked+.goal-label .box{background:var(--c);border-color:var(--c)}
.cb:checked+.goal-label .box .ic{opacity:1}
.cb:focus-visible+.goal-label .box{outline:2px solid var(--focus);outline-offset:2px}
.gt{display:block;line-height:20px;overflow-wrap:anywhere}

    parked: !!o.parked, example: !!o.example,

    sections: Array.isArray(o.sections) ? o.sections.map(normSection) : [],
  };
}
function normIdea(o, id){
  o = o || {};
  const sp = Math.round(num(o.spark));
  return {

/* ================= persistence ================= */
const DELETED = '__deleted__';
const pending = new Map();   // "coll/id" -> body queued but not yet sent
const inflight = new Set();

function startLocal(){
  if (S.mode !== 'loading') return;
  S.mode = 'local';
  // Saved work in this browser wins; otherwise start from the example workspace below.
  let d = null;
  try { const raw = localStorage.getItem(LS_KEY); if (raw) d = JSON.parse(raw); } catch {}
  if (!d) { try { d = JSON.parse(document.getElementById('foundry-seed').textContent); } catch {} }
  if (d) {
    (d.projects||[]).forEach(o => { if (o && o.id) S.projects.set(o.id, normProject(o, o.id)); });
    (d.ideas||[]).forEach(o => { if (o && o.id) S.ideas.set(o.id, normIdea(o, o.id)); });
  }
  render();
}
function saveLocal(){
  try { localStorage.setItem(LS_KEY, JSON.stringify({projects:[...S.projects.values()], ideas:[...S.ideas.values()]})); } catch {}
}
function startDb(db){
  if (S.mode !== 'loading') return;
  S.db = db; S.mode = 'db';
  const tries = {projects:0, ideas:0};
  const sub = coll => {
    db.collection(coll).onSnapshot(snap => { S.loaded[coll] = true; ingest(coll, snap); }, err => {
      if (err && err.code === 'unavailable' && tries[coll]++ < 3) { setTimeout(() => sub(coll), 1500); return; }
      S.dbLost = true; S.loaded[coll] = true; render();
    });
  };
  sub('projects'); sub('ideas');
}
function ingest(coll, snap){
  const map = new Map();
  const norm = coll === 'projects' ? normProject : normIdea;
  for (const d of snap.docs) { if (d.exists) map.set(d.id, norm(clone(d.data()), d.id)); }
  for (const [key, v] of pending) {
    const [c, id] = key.split('/');
    if (c !== coll) continue;
    if (v === DELETED) map.delete(id); else map.set(id, norm(clone(v), id));
  }
  S[coll] = map;
  render();
}
function queueWrite(key, body){
  pending.set(key, body);
  if (!inflight.has(key)) flush(key);
}
async function flush(key){
  inflight.add(key);
  try {
    while (pending.has(key)) {
      const v = pending.get(key); pending.delete(key);
      const ref = S.db.doc(key);
      const run = () => v === DELETED ? ref.delete() : ref.set(v);
      try { await run(); }
      catch (e) {
        if (e && e.code === 'unavailable') {
          await new Promise(r => setTimeout(r, 400 + Math.random()*800));
          try { await run(); } catch (e2) { writeFailed(e2); }
        } else writeFailed(e);
      }
    }
  } finally { inflight.delete(key); }
}
function writeFailed(e){
  const c = e && e.code;
  if (c === 'invalid_argument') { if (!S.readOnly) { S.readOnly = true; render(); toast('You can look around, but your access level does not allow saving changes.'); } }
  else if (c === 'quota_exceeded') toast('Your workspace is full. Delete a few old ideas or projects to add more.');
  else if (c === 'revoked' || c === 'not_granted') { S.dbLost = true; render(); toast('This page lost access to saved data. Reload to reconnect.'); }
  else toast('Could not save that change. Check your connection, then try again.');
}
function persist(coll, obj){
  if (S.mode === 'local') return saveLocal();
  if (S.mode !== 'db' || S.dbLost) return;
  const body = clone(obj); delete body.id;
  queueWrite(coll + '/' + obj.id, body);
}
function persistDel(coll, id){
  if (S.mode === 'local') return saveLocal();
  if (S.mode !== 'db' || S.dbLost) return;
  queueWrite(coll + '/' + id, DELETED);
}
function saveProject(p, quiet){ p.updatedAt = now(); S.projects.set(p.id, p); persist('projects', p); if (!quiet) render(); }
function saveIdea(i, quiet){ i.updatedAt = now(); S.ideas.set(i.id, i); persist('ideas', i); if (!quiet) render(); }

/* ================= render core ================= */
function render(){
  const vals = {};
  document.querySelectorAll('input[id],textarea[id],select[id]').forEach(el => { if (el.type !== 'checkbox' && el.type !== 'radio') vals[el.id] = el.value; });
  const ae = document.activeElement;
  const focus = ae && ae.id ? {id: ae.id, s: ae.selectionStart, e: ae.selectionEnd} : null;
  const bars = {};
  document.querySelectorAll('[data-bar]').forEach(el => { const i = el.firstElementChild; if (i) bars[el.dataset.bar] = i.style.width; });

  $('#side').innerHTML = renderSide();
  $('#main').innerHTML = `<div class="main-inner">${renderMain()}</div>`;
  $('#modal-root').innerHTML = renderModal();
  document.body.classList.toggle('nav-open', !!S.ui.navOpen);

  for (const [id, v] of Object.entries(vals)) { const el = document.getElementById(id); if (el && el.value !== v) el.value = v; }
  const af = S.ui.autofocus; S.ui.autofocus = null;
  const target = af ? document.getElementById(af) : (focus ? document.getElementById(focus.id) : null);
  if (target && document.activeElement !== target) {
    target.focus({preventScroll: !af});
    if (!af && focus && typeof focus.s === 'number') { try { target.setSelectionRange(focus.s, focus.e); } catch {} }
  }
  animateBars(bars);
  hideTip();
}
function animateBars(prev){
  if (reduced) return;
  const moves = [];
  document.querySelectorAll('[data-bar]').forEach(el => {
    const i = el.firstElementChild; const old = prev[el.dataset.bar];
    if (i && old != null && old !== i.style.width) { const t = i.style.width; i.style.transition = 'none'; i.style.width = old; moves.push([i, t]); }
  });
  if (!moves.length) return;
  void document.body.offsetWidth;
  moves.forEach(([i, t]) => { i.style.transition = ''; i.style.width = t; });
}
const bar = (key, pct, cls='') => `<span class="bar ${cls}" data-bar="${key}"><i style="width:${pct}%"></i></span>`;
function segBar(st, big){
  const segs = st.total ? st.secs.filter(x => x.d > 0).map(x => `<i class="k-${x.s.kind}" style="width:${(x.d/st.total*100).toFixed(2)}%;background:var(--c)" data-tip="${esc(x.s.name)}: ${x.d} of ${x.t} done"></i>`).join('') : '';
  return `<div class="seg${big ? ' seg-big' : ''}" role="img" aria-label="${st.done} of ${st.total} goals done, ${st.pct}%">${segs}</div>`;
}

function momentum(){

  return days;
}

      ${!proj ? `<button class="btn sm" data-action="idea-promote" data-id="${i.id}">${ic('rocket')} Make it a project</button>` : ''}

}

  return `

      <div class="head-actions">
        <button class="btn sm" data-action="edit-proj" data-pid="${p.id}">${ic('pencil')} Edit</button>

        <button class="btn sm ghost" data-action="ask-del-proj" data-pid="${p.id}">${ic('trash')} Delete</button>
      </div>`}
  </header>
  ${S.ui.confirm === 'proj:' + p.id ? `<div class="confirm"><p>Delete “${esc(p.name)}” and its ${st.total} goals? Linked ideas stay in your notebook.</p><div class="row"><button class="btn sm danger" data-action="del-proj" data-pid="${p.id}">Delete project</button><button class="btn sm" data-action="cancel">Cancel</button></div></div>` : ''}

function launchpad(p){
  const tiles = TOOLS.map(t => {
    const url = p.links[t.key];
    if (url) return `<div class="tool on"><a class="tool-main" href="${esc(url)}" target="_blank" rel="noopener noreferrer"><span class="tool-ic">${ic(t.icon)}</span><span class="tool-txt"><b>${t.name}</b><small>${esc(hostOf(url))}</small></span><span class="tool-go">${ic('ext')}</span></a><button class="icon-btn tool-edit" data-action="link-edit" data-pid="${p.id}" data-key="${t.key}" aria-label="Edit ${t.name} link" title="Edit link">${ic('pencil')}</button></div>`;
    return `<button class="tool off" data-action="link-edit" data-pid="${p.id}" data-key="${t.key}"><span class="tool-ic">${ic(t.icon)}</span><span class="tool-txt"><b>${t.name}</b><small>Connect</small></span><span class="tool-go">${ic('plus')}</span></button>`;
  });
  for (const c of p.custom) tiles.push(`<div class="tool on"><a class="tool-main" href="${esc(c.url)}" target="_blank" rel="noopener noreferrer"><span class="tool-ic">${ic('link')}</span><span class="tool-txt"><b>${esc(c.label)}</b><small>${esc(hostOf(c.url))}</small></span><span class="tool-go">${ic('ext')}</span></a><button class="icon-btn tool-edit" data-action="link-edit" data-pid="${p.id}" data-key="c:${c.id}" aria-label="Edit ${esc(c.label)} link" title="Edit link">${ic('pencil')}</button></div>`);
  tiles.push(`<button class="tool off" data-action="link-edit" data-pid="${p.id}" data-key="c:new"><span class="tool-ic">${ic('link')}</span><span class="tool-txt"><b>Any other tool</b><small>Figma, Notion, Stripe…</small></span><span class="tool-go">${ic('plus')}</span></button>`);
  const gh = ghParse(p.links.github);
  let extra = '';
  if (gh) {
    const base = `https://github.com/${encodeURIComponent(gh.owner)}/${encodeURIComponent(gh.repo)}`;
    extra = `<div class="gh-extra"><span class="muted">${esc(gh.owner)}/${esc(gh.repo)}</span>
      <a href="${base}/issues" target="_blank" rel="noopener noreferrer">Issues</a>
      <a href="${base}/pulls" target="_blank" rel="noopener noreferrer">Pull requests</a>
      <a href="${base}/actions" target="_blank" rel="noopener noreferrer">Actions</a>

      ${!p.links.vscode ? `<button class="linkish" data-action="fill-vscode" data-pid="${p.id}">${ic('code')} Link VS Code to this repo</button>` : ''}</div>`;
  }
  return `<div class="launch">${tiles.join('')}</div>${extra}${linkForm(p)}`;
}
function linkForm(p){

function renderGoal(p, s, g){

function sectionCard(p, s){

  if (sug) {
    sugBox = `<div class="suggest"><div class="ai-head"><span>Claude's suggestions</span>${sug.busy ? `<button class="btn sm" data-action="suggest-stop">${ic('stop')} Stop</button>` : `<button class="icon-btn" data-action="suggest-close" aria-label="Close suggestions">${ic('x')}</button>`}</div>
      ${sug.busy ? '<p class="thinking small" style="margin:0">Thinking</p>' : ''}
      ${sug.error ? `<p class="err">${esc(sug.error)}</p>` : ''}
      ${sug.items && sug.items.length ? `<ul>${sug.items.map((x, n) => `<li><span>${esc(x)}</span><button class="btn sm" data-action="suggest-add" data-pid="${p.id}" data-sid="${s.id}" data-i="${n}">${ic('plus')} Add</button></li>`).join('')}</ul>

          `<h3 id="sh-${s.id}"><span class="swatch"></span><span class="nm">${esc(s.name)}</span></h3>

      </div>
      <div class="sec-progress">${bar('s-' + s.id, pct, 'thick')}<span class="sec-pct">${t && pct === 100 ? ic('check') + 'Done' : pct + '%'}</span></div>

    ${t ? `<ul class="goals">${s.goals.map(g => renderGoal(p, s, g)).join('')}</ul>` : `<p class="sec-empty">No goals yet. Break the work into steps you can finish in a day.</p>`}

    ${sugBox}
    ${aiOn() && !sug ? `<div class="sec-foot"><button class="linkish" data-action="suggest" data-pid="${p.id}" data-sid="${s.id}">${ic('wand')} Suggest goals with Claude</button></div>` : ''}

}

/* ---------- modals ---------- */
function shell(title, body){

}
function renderModal(){
  const m = S.modal; if (!m) return '';
  if (m.type === 'jot') {
    return shell('Jot an idea', `<form data-form="jot">
      <label class="field"><span>Idea</span><textarea id="jot-text" rows="4" placeholder="First line is the title. Add detail below if you want."></textarea></label>

    : plan ? '' : `<div class="ai-row"><p>Let Claude draft the sections and first goals from your name and pitch. You can edit everything after.</p><button type="button" class="btn sm hl" data-action="np-draft">${ic('wand')} Draft a plan</button></div>`;

    <label class="field"><span>Project name</span><input id="np-name" value="${esc(m.name)}" maxlength="80" placeholder="e.g. Corner Cup coffee subscription" autocomplete="off"></label>

    <fieldset class="field"><legend>Stage</legend><div class="pick">${STAGES.map(s => `<button type="button" data-action="np-stage" data-stage="${s.key}" aria-pressed="${m.stage === s.key}">${s.label}</button>`).join('')}</div></fieldset>
    ${plan ? `<div class="plan"><div class="panel-head"><b>Claude's plan</b><button type="button" class="linkish" data-action="np-discard">Pick sections myself instead</button></div>
        <div class="plan-secs">${plan.map(x => `<div class="k-${x.kind}"><h4><span class="swatch sm"></span>${esc(KINDS[x.kind].label)}</h4><ul>${x.goals.map(g => `<li>${esc(g)}</li>`).join('')}</ul></div>`).join('')}</div></div>` :
      `<fieldset class="field"><legend>Sections</legend><div class="pick">${KIND_ORDER.map(k => `<button type="button" class="k-${k}" data-action="np-kind" data-kind="${k}" aria-pressed="${m.kinds.has(k)}"><span class="swatch sm"></span>${KINDS[k].label}</button>`).join('')}</div>

  </form>`);
}

/* ================= actions ================= */
function clearEdits(){
  if (S.ui.suggest && S.ui.suggest.ctl) S.ui.suggest.ctl.abort();
  Object.assign(S.ui, {editGoal:null, editIdea:null, renameSec:null, linkEdit:null, linkErr:null, editProj:null, confirm:null, addSec:null, suggest:null});
}
function closeModal(){
  if (S.modal && S.modal.ai && S.modal.ai.ctl) S.modal.ai.ctl.abort();
  S.modal = null; render();
}
function openNewProject(ideaId){
  const i = ideaId && S.ideas.get(ideaId);
  let name = '', pitch = '';
  if (i) { const [t, ...r] = i.text.split('\n'); name = t.trim().slice(0,80); pitch = r.join(' ').replace(/\s+/g,' ').trim().slice(0,240); }

function aiErr(e){
  const c = e && e.code;
  if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)) { S.aiOff = true; return 'Claude is not available on this page, so the Claude buttons are now hidden.'; }
  if (c === 'rate_limited') return 'Claude is busy or your usage limit was reached. Try again in a little while.';
  if (c === 'session_expired') return 'Sign in to Claude again, then try once more.';
  if (c === 'refused') return 'Claude could not help with this one. Try rewording it.';
  if (c === 'invalid_json' || c === 'empty_completion') return 'The answer came back in an unexpected shape. Try again.';
  if (c === 'prompt_too_large') return 'This is too long to send. Shorten it and try again.';
  return 'Something interrupted the answer. Try again.';
}
async function stressIdea(id){

  const ctl = new AbortController();
  S.ui.stress = {id, text:'', busy:true, ctl, error:null}; render();
  const prompt = `You're a sharp, encouraging startup advisor. A founder jotted this idea in their notebook:

"""
${i.text.slice(0,3000)}
"""
${i.tags.length ? 'Tags: ' + i.tags.join(', ') : ''}

Give a quick stress test in plain text. No Markdown: no #, no **, no bullet symbols. Use exactly these five labels, each starting its own line, each followed by one or two short sentences:
Who it's for:
The pain:
Riskiest assumption:
Cheapest test this week:
Name ideas:
Keep the whole answer under 170 words.`;

function toast(msg, undo){

  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button class="linkish" data-action="undo">Undo</button>' : ''}`;
  el.hidden = false; S.undo = undo || null;

}
function hideToast(){ $('#toast').hidden = true; S.undo = null; }
function showTip(el){
  const tip = $('#tip'); tip.textContent = el.dataset.tip; tip.hidden = false;
  const r = el.getBoundingClientRect(); const w = tip.offsetWidth, h = tip.offsetHeight;
  const x = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width/2 - w/2));
  let y = r.top - h - 8; if (y < 8) y = r.bottom + 8;
  tip.style.transform = `translate(${Math.round(x)}px,${Math.round(y)}px)`;
}
function hideTip(){ const t = $('#tip'); if (t) t.hidden = true; }
function burst(x, y, kind){
  if (reduced) return;
  const cv = $('#confetti'); const ctx = cv.getContext('2d'); if (!ctx) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const cols = [css.getPropertyValue('--c-' + kind).trim() || '#2a78d6', css.getPropertyValue('--hl').trim() || '#FFD43B', css.getPropertyValue('--ink').trim() || '#141D33'];
  const parts = Array.from({length: 80}, () => ({x, y, vx: (Math.random() - .5) * 10, vy: -Math.random() * 10 - 3, r: Math.random() * 6, vr: (Math.random() - .5) * .35, w: 5 + Math.random() * 5, h: 3 + Math.random() * 4, c: cols[Math.floor(Math.random() * cols.length)]}));
  const t0 = performance.now(); cancelAnimationFrame(S.confettiRaf);
  const step = t => {
    const el = t - t0; ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const q of parts) {
      q.vy += .32; q.vx *= .99; q.x += q.vx; q.y += q.vy; q.r += q.vr;
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.r); ctx.globalAlpha = Math.max(0, 1 - el / 1500); ctx.fillStyle = q.c; ctx.fillRect(-q.w/2, -q.h/2, q.w, q.h); ctx.restore();
    }
    if (el < 1500) S.confettiRaf = requestAnimationFrame(step); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  };
  S.confettiRaf = requestAnimationFrame(step);
}

/* ================= events ================= */
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) {
    S.ui.navOpen = false;
    if (nav.getAttribute('href') === location.hash || (nav.getAttribute('href') === '#hq' && !location.hash)) { e.preventDefault(); route(); }
    return;
  }
  const a = e.target.closest('[data-action]'); if (!a) return;
  const link = e.target.closest('a[href]'); if (link && link !== a && a.contains(link)) return;
  const fn = A[a.dataset.action]; if (!fn) return;
  e.preventDefault(); fn(a.dataset, a, e);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-change="goal"]')) toggleGoal(t.dataset.pid, t.dataset.sid, t.dataset.gid, t.checked, t);
  else if (t.id === 'np-starter' && S.modal) S.modal.starter = t.checked;
  else if (t.id === 'as-starter') S.ui.addStarter = t.checked;
});
document.addEventListener('input', e => { if (e.target.id === 'nb-search') { S.ui.q = e.target.value; render(); } });
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); const fn = F[f.dataset.form]; if (fn) fn(f);
});
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details.parked')) S.ui.parkedOpen = e.target.open; }, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.modal) { closeModal(); return; }
    if (S.ui.navOpen) { S.ui.navOpen = false; render(); return; }
    const u = S.ui; if (u.editGoal || u.editIdea || u.renameSec || u.linkEdit || u.editProj || u.confirm || u.addSec || u.suggest) { clearEdits(); render(); }
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    const f = e.target.closest && e.target.closest('form[data-form]');
    if (f) { e.preventDefault(); if (f.requestSubmit) f.requestSubmit(); else f.dispatchEvent(new Event('submit', {cancelable:true, bubbles:true})); }
  }
});
document.addEventListener('pointerover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); else hideTip(); });
document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); else hideTip(); });
window.addEventListener('scroll', hideTip, {passive:true});
window.addEventListener('hashchange', route);

function route(){
  const h = location.hash.slice(1);
  if (h === 'notebook') S.view = {name:'notebook'};
  else if (h.startsWith('project-')) S.view = {name:'project', id: h.slice(8)};
  else S.view = {name:'hq'};
  S.ui.navOpen = false;
  if (S.modal) { if (S.modal.ai && S.modal.ai.ctl) S.modal.ai.ctl.abort(); S.modal = null; }
  clearEdits(); render(); window.scrollTo(0, 0);
}

/* ================= boot ================= */
$('#topbar').innerHTML = `<button class="icon-btn" data-action="nav-toggle" aria-label="Open menu">${ic('menu')}</button><span class="logo" style="width:30px;height:30px">${ic('bolt','fill')}</span><b class="wordmark">Foundry</b><button class="btn sm hl" data-action="jot">${ic('bolt')} Jot</button>`;
route();
const c = window.claude;
if (!c || typeof c.use !== 'function') startLocal();
else {
  c.use('db').then(db => db ? startDb(db) : startLocal(), () => startLocal());
  c.use('sample').then(fn => { if (typeof fn === 'function') { S.ai = fn; render(); } }, () => {});
}
})();
</script>
